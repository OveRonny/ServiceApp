name: Deploy EF Core migrations to Azure SQL

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B635DD1A69754F8A9E0CDE8FC3E47659 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A93769371BDF433980CC63E74DFC4E5B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_664E5582142E4A4DBB3EB84E9744C75 }}

      - name: Fetch SQL connection string from Key Vault
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az keyvault secret show \
              --vault-name "${{ secrets.KEYVAULT_NAME }}" \
              --name "${{ secrets.SQL_CONN_SECRET_NAME }}" \
              --query value -o tsv > conn.txt

      - name: Export connection
        run: echo "SQL_CONN=$(cat conn.txt)" >> $GITHUB_ENV

      - name: Restore and build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Apply EF Core migrations
        working-directory: serviceApp.Server
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --connection "$SQL_CONN"
