name: Deploy EF Core migrations to Azure SQL

on: 
  workflow_dispatch: 

permissions: 
  id-token:  write
  contents: read

jobs:
  migrate:   
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: 10.0.x

      - name:  Verify connection string exists
        run: |
          if [ -z "${{ secrets. CONNECTIONSTRINGS__DEFAULTCONNECTION }}" ]; then 
            echo "ERROR: CONNECTIONSTRINGS__DEFAULTCONNECTION secret is not set"
            exit 1
          fi
          echo "Connection string is set ✓"

      - name:  Restore and build
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Show migrations
        working-directory: serviceApp. Server
        run: dotnet ef migrations list

      - name: Apply EF Core migrations
        working-directory: serviceApp.Server
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: dotnet ef database update --connection "${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}"
